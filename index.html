;color:var(--muted);line-height:1.55}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid .wide{grid-column:1/-1}.reportbars{display:flex;align-items:flex-end;gap:15px;min-height:180px;margin-top:20px}.reportbars .group{flex:1;text-align:center}.reportbars .column{height:140px;background:#eff4ef;border-radius:8px 8px 2px 2px;display:flex;align-items:flex-end;overflow:hidden}.reportbars .fill{background:#0c826d;width:100%;min-height:2px;border-radius:8px 8px 0 0}.reportbars .group b{display:block;font-size:11px;margin-top:8px}.reportbars .group small{font-size:10px;color:var(--muted)}.modalback{position:fixed;inset:0;background:#061b18b8;display:flex;align-items:center;justify-content:center;z-index:30;padding:22px;overflow-y:auto}.modal{background:#fff;border-radius:17px;width:min(680px,100%);max-height:min(90dvh,900px);overflow-y:auto;box-shadow:0 25px 80px #0004}.modalheader{position:sticky;top:0;z-index:2;background:white;padding:21px 25px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modalheader h2{margin:0;font-size:19px}.modalbody{padding:23px 25px}.modalfooter{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:10px;padding:17px 25px;background:white;border-top:1px solid var(--line)}.modalclose{border:0;background:#f2f5f1;border-radius:9px;width:34px;height:34px;font-size:20px;color:#64756b}.toast{position:fixed;right:25px;bottom:22px;z-index:50;background:#132a24;color:#fff;border-radius:11px;padding:14px 19px;box-shadow:0 12px 50px #0003;font-weight:650;max-width:380px;font-size:12px;line-height:1.5}.minititle{font-weight:800;margin-bottom:9px;font-size:12px}.history{border-left:2px solid #dde7e0;padding-left:14px;margin:14px 0 0}.historyitem{position:relative;margin-bottom:15px}.historyitem:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--main);position:absolute;left:-18.5px;top:5px}.historyitem strong{font-size:12px}.historyitem p{font-size:11px <body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='quote-rescue-v1', MAX_QUOTES=2000;
const ICONS={dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>',quotes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7h8M8 12h8M8 17h5"/></svg>',followups:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg>',reports:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 20h18M6 16V9M12 16V4M18 16v-5"/></svg>',settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M4 8l2-3 3 1 2-2h3l2 2 3-1 2 3-2 3v3l2 2-2 3-3-1-2 2h-3l-2-2-3 1-2-3 2-2v-3z"/></svg>'};
let state=load(),tab='dashboard',query='',filter='all',sort='due',showMenu=false,modal=null,noticeTimer=0;
const root=document.getElementById('app'),modalRoot=document.getElementById('modal-root');
function defaults(){return {version:1,business:{name:'Your business',email:'',first:3,second:7,later:14},quotes:[],demo:false};}
function safeText(v,max=300){return String(v??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').slice(0,max);}
function emailSafe(s){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s) && !/[\r\n<>]/.test(s) && s.length<=150;}
function isDate(v){return /^\d{4}-\d{2}-\d{2}$/.test(v||'')&&!Number.isNaN(new Date(v+'T12:00:00').getTime())&&new Date(v+'T12:00:00').toISOString().slice(0,10)===v;}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function offsetDate(date,days){let [y,m,d]=(isDate(date)?date:today()).split('-').map(Number);let x=new Date(y,m-1,d+Number(days));return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;}
function dateDiff(a,b){return Math.round((Date.parse(a+'T12:00:00Z')-Date.parse(b+'T12:00:00Z'))/86400000);}
function displayDate(s){return isDate(s)?new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';}
function money(n){return new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(Number(n)||0);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function id(){return (globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():'q'+Date.now().toString(36)+Math.random().toString(36).slice(2);}
function validStatus(s){return ['draft','sent','discussion','won','lost'].includes(s)?s:'draft';}
function tidyQuote(q){if(!q||typeof q!=='object')throw new Error('Invalid quote record');const created=isDate(q.createdAt)?q.createdAt:today();const status=validStatus(q.status);return {id:safeText(q.id||id(),100),customer:safeText(q.customer,120).trim(),company:safeText(q.company,120).trim(),email:safeText(q.email,150).trim(),phone:safeText(q.phone,40).trim(),description:safeText(q.description,240).trim(),amount:Math.max(0,Math.min(100000000,Number(q.amount)||0)),status,createdAt:created,sentAt:isDate(q.sentAt)?q.sentAt:'',lastContactAt:isDate(q.lastContactAt)?q.lastContactAt:'',nextFollowupAt:isDate(q.nextFollowupAt)?q.nextFollowupAt:'',followupsSent:Math.max(0,Math.min(999,Math.floor(Number(q.followupsSent)||0))),note:safeText(q.note,1500),history:Array.isArray(q.history)?q.history.slice(-50).map(h=>({when:isDate(h?.when)?h.when:created,what:safeText(h?.what,150)})):[]};}
function validate(data){if(!data||data.version!==1||!Array.isArray(data.quotes)||data.quotes.length>MAX_QUOTES)throw new Error('The backup is invalid or from an unsupported version.');const d=defaults();const b=data.business||{};d.business={name:safeText(b.name||'Your business',100),email:safeText(b.email,150),first:clampDays(b.first,3),second:clampDays(b.second,7),later:clampDays(b.later,14)};d.quotes=data.quotes.map(tidyQuote);const ids=new Set();for(const q of d.quotes){if(ids.has(q.id))q.id=id();ids.add(q.id);}d.demo=!!data.demo;return d;}
function clampDays(x,fallback){const n=Number(x);return Number.isInteger(n)&&n>=1&&n<=90?n:fallback;}
function load(){try{return validate(JSON.parse(localStorage.getItem(KEY)||'null'));}catch{return defaults();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){alert('Could not save changes. Your browser storage may be full or blocked. Export a JSON backup before closing this page.');return false;}return true;}
function persist(){save();render();}
function toast(message){const holder=document.getElementById('toast-root');holder.innerHTML=`<div class="toast" role="status">${esc(message)}</div>`;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{holder.innerHTML='';},3500);}
function log(q,what,when=today()){q.history.push({when,what});if(q.history.length>50)q.history.shift();}
function eligible(q){return q.status==='sent'||q.status==='discussion';}
function queue(){return state.quotes.filter(q=>eligible(q)&&isDate(q.nextFollowupAt)).sort((a,b)=>a.nextFollowupAt.localeCompare(b.nextFollowupAt));}
function overdue(){return queue().filter(q=>q.nextFollowupAt<=today());}
function active(){return state.quotes.filter(q=>eligible(q));}
function total(items){return items.reduce((a,q)=>a+q.amount,0);}
function statusPill(s){return `<span class="pill ${esc(s)}">${({draft:'Draft',sent:'Quote sent',discussion:'In discussion',won:'Won',lost:'Lost'})[s]||s}</span>`;}
function duePill(q){if(!eligible(q)||!q.nextFollowupAt)return '<span class="tiny">—</span>';const diff=dateDiff(q.nextFollowupAt,today());return diff<0?`<span class="pill overdue">${Math.abs(diff)}d overdue</span>`:diff===0?'<span class="pill overdue">Due today</span>':`<span class="tiny">${displayDate(q.nextFollowupAt)}</span>`;}
function linkButton(q){return `<button class="btn sm" data-act="draft" data-id="${esc(q.id)}">Draft follow-up</button>`;}
function empty(icon,head,body,cta){return `<div class="empty"><div class="emoji">${icon}</div><h3>${head}</h3><p>${body}</p>${cta||''}</div>`;}
function titleForTab(){return ({dashboard:'Dashboard',quotes:'Quotes',followups:'Follow-ups',reports:'Reports',settings:'Settings'})[tab];}
function header(){return `<aside class="sidebar ${showMenu?'show':''}"><div class="brand"><div class="logo">↗</div><div>Quote Rescue<small>SALES FOLLOW-UP</small></div></div><div class="navtitle">WORKSPACE</div>${[['dashboard','Dashboard'],['quotes','All quotes'],['followups','Follow-ups'],['reports','Reports'],['settings','Settings']].map(([key,name])=>`<button class="nav ${tab===key?'active':''}" data-act="tab" data-tab="${key}">${ICONS[key]} ${name}${key==='followups'&&overdue().length?`<span class="navcount">${overdue().length}</span>`:''}</button>`).join('')}<div class="sidebar-bottom"><strong><span class="dot"></span> Private by design</strong>Stored on this device only. No subscriptions, no third-party tracking.<div style="margin-top:7px;color:#92b2a6">Back up your data in Settings.</div></div></aside><div class="sidebar-shade ${showMenu?'show':''}" data-act="close-menu"></div><div class="main"><header class="topbar"><div style="display:flex;align-items:center"><button class="menu-button" data-act="menu" aria-label="Open menu">☰</button><div><h1>${titleForTab()}</h1><div class="subtitle">${esc(state.business.name)} <span style="color:#b4c3bb">·</span> Quote follow-up workspace</div></div></div><div class="topactions"><span class="datechip">${displayDate(today())}</span><button class="btn primary" data-act="new"><span>＋ New quote</span></button></div></header>${state.demo?'<div class="demo-banner"><div>🧪 <strong>Demo mode</strong> — fictional example customers, not real business data.</div><button data-act="reset-demo">Start with real data</button></div>':''}<main class="content">`}
function footer(){return '</main></div>';}
function dashboard(){const due=overdue(),recent=[...state.quotes].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,5);const sales=state.quotes.filter(q=>q.status==='won');return `<section class="hero"><div><div class="eyebrow">Your follow-up command centre</div><h2>Turn forgotten quotes into<br>conversations again.</h2><p>Stay on top of every opportunity, send thoughtful follow-ups, and understand your pipeline — all in one place.</p></div><button class="btn" data-act="new">＋ Add a quote</button></section><div class="kpis"><div class="kpi"><div class="label">Open pipeline <span class="tag">↗</span></div><div class="value">${money(total(active()))}</div><div class="sub">${active().length} active quote${active().length===1?'':'s'}</div></div><div class="kpi"><div class="label">Follow-ups due <span class="tag">◷</span></div><div class="value">${due.length}</div><div class="sub">${due.length?'Ready for action':'All caught up'}</div></div><div class="kpi"><div class="label">Revenue won <span class="tag">✓</span></div><div class="value">${money(total(sales))}</div><div class="sub">${sales.length} quote${sales.length===1?'':'s'} marked won</div></div><div class="kpi"><div class="label">Quotes tracked <span class="tag">▤</span></div><div class="value">${state.quotes.length}</div><div class="sub">Across every status</div></div></div><div class="grid2"><section><div class="sectionhead"><h3 class="section-title">Needs your attention</h3><button class="btn link sm" data-act="tab" data-tab="followups">View all →</button></div><div class="panel">${due.length?due.slice(0,5).map(q=>`<div class="activity"><div class="activitydot">◷</div><div><strong>${esc(q.customer||q.company)} · ${esc(q.description||'Quote')}</strong><p>${money(q.amount)} · ${q.nextFollowupAt===today()?'Due today':Math.abs(dateDiff(q.nextFollowupAt,today()))+' days overdue'}</p></div>${linkButton(q)}</div>`).join(''):empty('✓','Nothing overdue','Any follow-up reminders that are due will appear here.')}</div></section><section><div class="sectionhead"><h3 class="section-title">Recently added</h3><button class="btn link sm" data-act="tab" data-tab="quotes">All quotes →</button></div><div class="panel">${recent.length?recent.map(q=>`<div class="activity"><div class="activitydot">↗</div><div><strong>${esc(q.customer||q.company)}</strong><p>${esc(q.description||'Quote')} · ${money(q.amount)}</p></div>${statusPill(q.status)}</div>`).join(''):empty('▤','Build your pipeline','Add your first quote to get started. <br>Or explore with fictional data.','<button class="btn primary" data-act="new">Add quote</button><button class="btn" data-act="demo">Try demo</button>')}</div></section></div>${!state.quotes.length?'<div class="callout info" style="margin-top:22px">💡 <strong>New here?</strong> Select “Try demo” to see how Quote Rescue works with fictional data. Your real data stays on your device.</div>':''}<p class="footnote">“Revenue won” reflects quotes manually marked won. Quote Rescue does not verify payments or guarantee sales results.</p>`;}
function quotesPage(){const all=state.quotes.filter(q=>(filter==='all'||q.status===filter)&&`${q.customer} ${q.company} ${q.description} ${q.email}`.toLowerCase().includes(query.toLowerCase()));all.sort((a,b)=>sort==='amount'?b.amount-a.amount:sort==='newest'?b.createdAt.localeCompare(a.createdAt):sort==='customer'?a.customer.localeCompare(b.customer):(a.nextFollowupAt||'9999').localeCompare(b.nextFollowupAt||'9999'));return `<div class="row"><div><h2 class="section-title">Your quote pipeline</h2><p class="tiny">Track opportunities from first quote to final outcome.</p></div><button class="btn sm" data-act="export-csv">↓ Export CSV</button></div><div class="toolbar"><input class="search" id="quote-search" aria-label="Search quotes" placeholder="Search customer, company or job…" value="${esc(query)}"><select class="control" id="quote-filter" aria-label="Filter quotes">${[['all','All statuses'],['draft','Draft'],['sent','Quote sent'],['discussion','In discussion'],['won','Won'],['lost','Lost']].map(([k,v])=>`<option value="${k}" ${filter===k?'selected':''}>${v}</option>`).join('')}</select><select class="control" id="quote-sort" aria-label="Sort quotes"><option value="due" ${sort==='due'?'selected':''}>Sort: Follow-up due</option><option value="newest" ${sort==='newest'?'selected':''}>Sort: Newest first</option><option value="amount" ${sort==='amount'?'selected':''}>Sort: Highest value</option><option value="customer" ${sort==='customer'?'selected':''}>Sort: Customer name</option></select></div>${all.length?`<div class="tablewrap"><table class="datatable"><thead><tr><th>Customer / job</th><th>Quote value</th><th>Status</th><th>Next follow-up</th><th>Created</th><th>Actions</th></tr></thead><tbody>${all.map(q=>`<tr><td><div class="cell-title">${esc(q.customer||q.company)}</div><div class="cell-sub">${esc(q.description||'No description')}${q.company&&q.customer?' · '+esc(q.company):''}</div></td><td class="money">${money(q.amount)}</td><td>${statusPill(q.status)}</td><td>${duePill(q)}</td><td>${displayDate(q.createdAt)}</td><td><div class="rows-actions"><button class="btn sm" data-act="edit" data-id="${esc(q.id)}">Open</button>${eligible(q)?`<button class="btn sm" data-act="draft" data-id="${esc(q.id)}">Follow up</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:empty('▤','No matching quotes','Try another search or add a new opportunity.','<button class="btn primary" data-act="new">＋ Add quote</button>')}${state.quotes.length?`<p class="footnote">Showing ${all.length} of ${state.quotes.length} quotes. Use Settings to import or back up your records.</p>`:''}`;}
function followupsPage(){const items=queue(),due=items.filter(q=>q.nextFollowupAt<=today()),soon=items.filter(q=>q.nextFollowupAt>today()&&dateDiff(q.nextFollowupAt,today())<=14);return `<div class="callout info"><strong>You're in control:</strong> Quote Rescue creates editable follow-up drafts. It does not automatically email customers. Open your email app and confirm that a message was sent before recording it here.</div><div class="row"><div><h2 class="section-title">Follow-ups due (${due.length})</h2><p class="tiny">Sorted by oldest due date first.</p></div><button class="btn sm" data-act="export-csv">Export list</button></div><div class="stack" style="margin-top:16px">${due.length?due.map(followCard).join(''):empty('✓','All caught up','No follow-ups are due. Quotes will appear automatically when their reminder date arrives.','<button class="btn" data-act="tab" data-tab="quotes">View quotes</button>')}</div><div class="sectionhead"><h3 class="section-title">Coming up (next 14 days)</h3><small>${soon.length} scheduled</small></div><div class="stack">${soon.length?soon.map(followCard).join(''):'<div class="panel" style="color:var(--muted);font-size:12px">No follow-ups scheduled in the next two weeks.</div>'}</div>`;}
function followCard(q){return `<div class="followcard"><div><div class="row" style="justify-content:flex-start;gap:8px"><h4>${esc(q.customer||q.company)}</h4>${duePill(q)}</div><p>${esc(q.description||'Quote')} · <strong>${money(q.amount)}</strong>${q.company&&q.customer?' · '+esc(q.company):''}</p><div class="tiny">Last contact: ${displayDate(q.lastContactAt||q.sentAt)} · Follow-ups: ${q.followupsSent}</div></div><div class="actions"><button class="btn primary sm" data-act="draft" data-id="${esc(q.id)}">Write follow-up</button><button class="btn sm" data-act="snooze" data-id="${esc(q.id)}">Snooze 3d</button><button class="btn sm" data-act="replied" data-id="${esc(q.id)}">Replied</button></div></div>`;}
function reportsPage(){const all=state.quotes,closed=all.filter(q=>['won','lost'].includes(q.status)),won=all.filter(q=>q.status==='won'),avg=all.length?total(all)/all.length:0,rate=closed.length?Math.round(won.length/closed.length*100):0,groups=[['Draft',all.filter(q=>q.status==='draft')],['Sent',all.filter(q=>q.status==='sent')],['Discussion',all.filter(q=>q.status==='discussion')],['Won',won],['Lost',all.filter(q=>q.status==='lost')]],high=Math.max(1,...groups.map(g=>g[1].length));return `<div class="sectionhead"><h3 class="section-title">Your pipeline at a glance</h3><small>Figures reflect the statuses you recorded</small></div><div class="kpis" style="margin-top:0"><div class="kpi"><div class="label">Total quoted</div><div class="value">${money(total(all))}</div><div class="sub">All records combined</div></div><div class="kpi"><div class="label">Average quote</div><div class="value">${money(avg)}</div><div class="sub">Across ${all.length} quote${all.length===1?'':'s'}</div></div><div class="kpi"><div class="label">Win rate</div><div class="value">${rate}%</div><div class="sub">Won ÷ won and lost</div></div><div class="kpi"><div class="label">Closed quotes</div><div class="value">${closed.length}</div><div class="sub">Won or lost</div></div></div><div class="grid2" style="margin-top:20px"><div class="panel"><div class="panelhead"><h3>Quotes by stage</h3><span class="tiny">Count</span></div><div class="reportbars">${groups.map(([name,qs])=>`<div class="group"><div class="column"><div class="fill" style="height:${qs.length?Math.max(5,qs.length/high*100):0}%"></div></div><b>${qs.length}</b><small>${name}</small></div>`).join('')}</div></div><div class="panel"><div class="panelhead"><h3>Financial overview</h3></div><div class="stack">${[['Active quote value',money(total(active()))],['Value marked won',money(total(won))],['Value marked lost',money(total(all.filter(q=>q.status==='lost')))],['Open quotes needing follow-up',String(overdue().length)]].map(([name,v])=>`<div class="row" style="border-bottom:1px solid #edf1ed;padding-bottom:14px"><span class="tiny">${name}</span><strong>${v}</strong></div>`).join('')}</div></div></div><p class="footnote">Estimates based solely on manually entered quotes. Revenue marked won is not confirmation of payment. This software cannot prove increased conversion without a baseline and actual outcomes.</p>`;}
function settingsPage(){const b=state.business;return `<div class="settingsgrid"><div class="panel"><div class="panelhead"><h3>Business profile</h3></div><form id="settings-form" class="stack"><div class="formfield"><label for="business-name">Business name</label><input id="business-name" name="name" value="${esc(b.name)}" required maxlength="100"></div><div class="formfield"><label for="business-email">Business email (reference only)</label><input id="business-email" name="email" type="email" value="${esc(b.email)}" maxlength="150" placeholder="hello@example.co.uk"></div><div class="minititle">Reminder schedule</div><div class="formgrid"><div class="formfield"><label for="first-delay">Initial reminder (days)</label><input id="first-delay" name="first" type="number" min="1" max="90" value="${b.first}" required></div><div class="formfield"><label for="second-delay">After 1st follow-up</label><input id="second-delay" name="second" type="number" min="1" max="90" value="${b.second}" required></div><div class="formfield wide"><label for="later-delay">After later follow-ups (days)</label><input id="later-delay" name="later" type="number" min="1" max="90" value="${b.later}" required></div></div><p class="hint">Newly sent quotes default to the initial reminder delay. Changing these settings does not retroactively change existing reminder dates.</p><button class="btn primary" type="submit">Save settings</button></form></div><div class="panel"><div class="panelhead"><h3>Your data & backups</h3></div><div class="callout info">🔒 Your data stays in this browser on this device. There are no accounts, cloud sync, external analytics, or outbound data requests.</div><p class="hint">Browser storage can be erased, especially in private browsing. Export a JSON backup after every significant update. A downloaded backup may contain customer information — store it securely.</p><div class="settings-actions"><button class="btn" data-act="export-json">↓ Download backup</button><button class="btn" data-act="import-json">↑ Restore backup</button><button class="btn" data-act="export-csv">↓ Export CSV</button><button class="btn" data-act="import-csv">↑ Import CSV</button><button class="btn" data-act="template-csv">CSV template</button></div><div class="sepline"></div><div class="minititle">Demo and reset</div><p class="hint">Demo data is fictional. Clear it before starting with real clients.</p><div class="settings-actions"><button class="btn" data-act="demo">Load example data</button><button class="btn danger" data-act="clear">Delete all local data</button></div><div class="sepline"></div><div class="minititle">Important limitations</div><p class="hint">Reminders appear when you open the app; no background notifications. Drafts are reviewed and sent manually through your email client. Offline drafts are template-based; the optional AI prompt can be copied into a separate AI tool. This single-user version is not a hosted multi-user CRM.</p></div></div><div class="panel" style="margin-top:18px"><h3 style="margin-top:0">About Quote Rescue</h3><p class="hint">Version 1.0 · Offline-first · No dependencies · Built for small business quote follow-up. Keep lawful records, respect customer communication preferences, and only import data that you have permission to use.</p></div>`;}
function render(){root.innerHTML=header()+({dashboard,quotes:quotesPage,followups:followupsPage,reports:reportsPage,settings:settingsPage}[tab])()+footer();}
function openModal(title,body,footerHtml){modal={title,body,footerHtml};modalRoot.innerHTML=`<div class="modalback" data-act="dismiss"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modalheader"><h2 id="modal-title">${esc(title)}</h2><button class="modalclose" data-act="close" aria-label="Close dialog">×</button></header><div class="modalbody">${body}</div><footer class="modalfooter">${footerHtml}</footer></section></div>`;setTimeout(()=>{modalRoot.querySelector('input,textarea,select,button')?.focus();},0);}
function closeModal(){modal=null;modalRoot.innerHTML='';}
function quoteForm(q){const editing=!!q;q=q||{customer:'',company:'',email:'',phone:'',description:'',amount:'',status:'sent',createdAt:today(),nextFollowupAt:offsetDate(today(),state.business.first),note:''};const next=q.nextFollowupAt||(eligible(q)?offsetDate(q.createdAt,state.business.first):'');openModal(editing?'Edit quote':'Add a new quote',`<form id="quote-form" class="formgrid" data-id="${esc(q.id||'')}"><div class="formfield"><label for="q-customer">Customer name *</label><input id="q-customer" name="customer" required maxlength="120" value="${esc(q.customer)}" placeholder="e.g. Alex Morgan"></div><div class="formfield"><label for="q-company">Customer company</label><input id="q-company" name="company" maxlength="120" value="${esc(q.company)}" placeholder="Optional"></div><div class="formfield"><label for="q-email">Email</label><input id="q-email" name="email" type="email" maxlength="150" value="${esc(q.email)}" placeholder="customer@example.com"></div><div class="formfield"><label for="q-phone">Phone</label><input id="q-phone" name="phone" type="tel" maxlength="40" value="${esc(q.phone)}"></div><div class="formfield wide"><label for="q-desc">Job / quote description *</label><input id="q-desc" name="description" maxlength="240" value="${esc(q.description)}" required placeholder="e.g. Kitchen refurbishment"></div><div class="formfield"><label for="q-amount">Quote value (£) *</label><input id="q-amount" name="amount" type="number" min="0" max="100000000" step="0.01" required value="${esc(q.amount)}"></div><div class="formfield"><label for="q-status">Status</label><select id="q-status" name="status">${[['draft','Draft'],['sent','Quote sent'],['discussion','In discussion'],['won','Won'],['lost','Lost']].map(([k,v])=>`<option value="${k}" ${q.status===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="formfield"><label for="q-created">Quote date</label><input id="q-created" name="createdAt" type="date" value="${esc(q.createdAt)}" required></div><div class="formfield"><label for="q-next">Next follow-up date</label><input id="q-next" name="nextFollowupAt" type="date" data-auto="${editing?'0':'1'}" value="${esc(next)}"><small class="hint">Only active quotes produce reminders.</small></div><div class="formfield wide"><label for="q-notes">Private notes</label><textarea id="q-notes" name="note" maxlength="1500" placeholder="Next steps, context, customer preferences…">${esc(q.note)}</textarea></div></form>${editing?`<div class="sepline"></div><div class="row"><strong>Activity history</strong><button class="btn danger sm" data-act="delete" data-id="${esc(q.id)}">Delete quote</button></div><div class="history">${(q.history||[]).slice().reverse().map(h=>`<div class="historyitem"><strong>${esc(h.what)}</strong><p>${displayDate(h.when)}</p></div>`).join('')||'<p class="tiny">No activity recorded yet.</p>'}</div>`:''}`,`<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save-quote">${editing?'Save changes':'Add quote'}</button>`);}
function saveQuote(){const f=modalRoot.querySelector('#quote-form');if(!f)return;if(!f.reportValidity())return;const data=Object.fromEntries(new FormData(f)),edit=state.quotes.find(q=>q.id===f.dataset.id);const created=data.createdAt;if(!isDate(created)||Number(data.amount)<0||Number(data.amount)>100000000)return toast('Check the quote date and amount.');if(data.email&&!emailSafe(data.email))return toast('Please enter a valid email address.');let q=tidyQuote({...edit,...data,id:edit?.id||id(),amount:Number(data.amount),nextFollowupAt:data.nextFollowupAt||'',lastContactAt:edit?.lastContactAt||(eligible(data)?created:'')});if(!edit){q.sentAt=eligible(q)?created:'';q.lastContactAt=eligible(q)?created:'';if(eligible(q)&&!q.nextFollowupAt)q.nextFollowupAt=offsetDate(created,state.business.first);log(q,'Quote added');state.quotes.push(q);}else{if(edit.status!==q.status){log(q,`Status changed: ${edit.status} → ${q.status}`);if(!eligible(edit)&&eligible(q)&&!q.nextFollowupAt)q.nextFollowupAt=offsetDate(today(),state.business.first);if(eligible(q)&&!q.lastContactAt)q.lastContactAt=today();}state.quotes[state.quotes.indexOf(edit)]=q;}if(!eligible(q))q.nextFollowupAt='';closeModal();persist();toast(edit?'Quote updated.':'Quote added to your pipeline.');}
function draftEmail(q,style,includePrice){
const first=(q.customer||'there').trim().split(/\s+/)[0];
const project=(q.description||'your project').trim();
const price=includePrice&&Number(q.amount)>0?' ('+money(q.amount)+')':'';
const business=state.business.name||'The team';
const n=q.followupsSent;
const subject=style==='direct'?'Quick question about your '+project:style==='friendly'?'Checking in about your '+project:'Following up on your '+project+' quote';
let body;
if(style==='direct')body='Hi '+first+',\n\nAre you still considering the quote for '+project+price+'?\n\nIf you have any questions or would like to discuss the next steps, just reply to this email.\n\nBest wishes,\n'+business;
else if(style==='friendly')body='Hi '+first+',\n\nHope you’re well! Just wanted to check how you’re getting on with the quote for '+project+price+'.\n\nThere’s no rush — if you’d like to talk through anything, I’m happy to help.\n\nBest wishes,\n'+business;
else if(n>=2)body='Hi '+first+',\n\nI wanted to make one final check-in about the quote for '+project+price+'.\n\nIf the timing isn’t right, that’s absolutely fine. Feel free to get in touch whenever you’re ready.\n\nBest wishes,\n'+business;
else if(n===1)body='Hi '+first+',\n\nJust following up on the quote for '+project+price+'.\n\nAre you still considering it, or is there anything we can clarify? No pressure either way.\n\nBest wishes,\n'+business;
else body='Hi '+first+',\n\nI wanted to check whether you had any questions about the quote for '+project+price+'.\n\nIf you’d like to discuss any details or next steps, I’d be happy to help.\n\nBest wishes,\n'+business;
return {subject,body};
}
function refreshDraft(q){
const style=modalRoot.querySelector('#draft-style')?.value||'professional';
const includePrice=!!modalRoot.querySelector('#draft-price')?.checked;
const draft=draftEmail(q,style,includePrice);
modalRoot.querySelector('#draft-subject').value=draft.subject;
modalRoot.querySelector('#draft-message').value=draft.body;
}
function compose(q){
const draft=draftEmail(q,'professional',true);
openModal('Review follow-up email',`<div class="callout info"><strong>Ready-to-edit email:</strong> Quote Rescue writes a personalised draft on your device. This is not a cloud AI model. Nothing is sent automatically. Review details and confirm the customer expects this follow-up.</div>
<div class="row" style="margin-bottom:17px"><div><strong>${esc(q.customer||q.company)}</strong><div class="tiny">${esc(q.email||'No email entered')} · ${money(q.amount)}</div></div>${statusPill(q.status)}</div>
<div class="formgrid" style="margin-bottom:14px"><div class="formfield"><label for="draft-style">Writing style</label><select id="draft-style"><option value="professional">Professional</option><option value="friendly">Friendly</option><option value="direct">Short & direct</option></select></div><div class="formfield"><label for="draft-price">Price in email</label><label style="display:flex;align-items:center;gap:9px;padding-top:10px"><input type="checkbox" id="draft-price" checked style="width:auto"> Include quoted price</label></div></div>
<div class="formfield" style="margin-bottom:14px"><label for="draft-subject">Subject</label><input id="draft-subject" maxlength="180" value="${esc(draft.subject)}"></div>
<div class="formfield"><label for="draft-message">Message (edit before sending)</label><textarea id="draft-message" style="min-height:245px">${esc(draft.body)}</textarea></div>
<p class="hint">Changing the style or price setting regenerates the draft and replaces edits. Open email to send manually, then record as sent only after sending.</p>`,`<button class="btn" data-act="ai-prompt">External AI prompt</button><button class="btn" data-act="copy-draft">Copy text</button><button class="btn" data-act="email-draft" data-id="${esc(q.id)}" ${emailSafe(q.email)?'':'disabled'}>Open email</button><button class="btn primary" data-act="record-sent" data-id="${esc(q.id)}">Record as sent</button>`);
}
async function copyDraft(){const text=modalRoot.querySelector('#draft-message')?.value;if(!text)return;try{await navigator.clipboard.writeText(text);toast('Draft copied to clipboard.');}catch{const t=modalRoot.querySelector('#draft-message');t.focus();t.select();toast('Select the message and use Copy.');}}
function aiPrompt(){const prompt='Draft a short, professional, warm follow-up email (around 80 words) for a UK home improvement business contacting someone who has already requested and received a quote. It should be helpful, not pushy, include one clear question, never invent discounts or deadlines, and respect a customer who declines. Provide a subject line and body. Use placeholders [Customer first name], [Project] and [Business name] rather than personal data. No marketing claims or promises.';openModal('Use your preferred AI tool',`<div class="callout info">This optional step creates a privacy-friendly prompt. Copy it into an AI tool yourself. No customer details are shared automatically.</div><div class="formfield"><label for="draft-message">Copy this prompt</label><textarea id="draft-message" style="min-height:195px">${esc(prompt)}</textarea></div><p class="hint">AI output requires your review. Do not paste identifiable customer information into external tools unless the business has authorised it.</p>`,`<button class="btn" data-act="close">Close</button><button class="btn primary" data-act="copy-draft">Copy AI prompt</button>`);}
function recordSent(q){if(!confirm('Only confirm if you actually sent the follow-up message outside Quote Rescue. Record as sent?'))return;const n=q.followupsSent+1;q.followupsSent=n;q.lastContactAt=today();if(q.status==='draft')q.status='sent';const delay=n===1?state.business.second:state.business.later;q.nextFollowupAt=offsetDate(today(),delay);log(q,`Follow-up #${n} recorded as sent`);closeModal();persist();toast(`Recorded. Next reminder: ${displayDate(q.nextFollowupAt)}.`);}
function demo(){if(state.quotes.length&&!confirm('Loading the demo replaces your current local records. Download a backup first if you need them. Continue?'))return;const start=today();const specs=[['Amelia Parker','Harbour Kitchens','amelia@example.com','Kitchen refurbishment',4280,'sent',-16,3,-2],['Oliver Reed','Coastline Renovations','oliver@example.com','Bathroom renovation',6750,'discussion',-9,1,0],['Sophie Baker','Westfield Interiors','sophie@example.com','Fitted wardrobes',2140,'sent',-5,0,2],['James Taylor','','james@example.com','Patio installation',3200,'won',-21,2,0],['Emily Stone','','emily@example.com','Garage conversion',9100,'draft',-1,0,0],['Noah Wilson','','noah@example.com','Garden room',12500,'lost',-28,2,0]];state=defaults();state.demo=true;state.business.name='Coastal Home Projects (Demo)';state.quotes=specs.map(([customer,company,email,description,amount,status,createdAgo,followupsSent,dueOffset])=>tidyQuote({id:id(),customer,company,email,phone:'',description,amount,status,createdAt:offsetDate(start,createdAgo),sentAt:offsetDate(start,createdAgo),lastContactAt:offsetDate(start,createdAgo+2),nextFollowupAt:eligible({status})?offsetDate(start,dueOffset):'',followupsSent,history:[{when:offsetDate(start,createdAgo),what:'Demo quote created'}]}));closeModal();tab='dashboard';persist();toast('Demo loaded with fictional data.');}
function download(filename,text,mime){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);}
const csvHeaders=['id','customer','company','email','phone','description','amount','status','createdAt','sentAt','lastContactAt','nextFollowupAt','followupsSent','note'];
function csvEscape(v){let s=String(v??'');if(/^[\s]*[=+@\-\t\r]/.test(s)&&!/^\d{4}-\d{2}-\d{2}$/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportCsv(){const rows=[csvHeaders,...state.quotes.map(q=>csvHeaders.map(k=>q[k]??''))];download('quote-rescue-quotes-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV downloaded.');}
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(field);field='';}else if((c==='\r'||c==='\n')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(v=>v!==''))rows.push(row);row=[];field='';}else field+=c;}if(quoted)throw new Error('CSV contains an unclosed quote.');row.push(field);if(row.some(v=>v!==''))rows.push(row);return rows;}
function importCSV(text){const rows=parseCSV(text.replace(/^\ufeff/,''));if(!rows.length)throw new Error('Empty CSV file.');const headers=rows.shift().map(h=>h.trim());if(!headers.includes('customer')||!headers.includes('description')||!headers.includes('amount'))throw new Error('CSV needs customer, description and amount columns. Download the template first.');if(state.quotes.length+rows.length>MAX_QUOTES)throw new Error('Too many records for this version.');const incoming=[];for(let i=0;i<rows.length;i++){const x=Object.fromEntries(headers.map((h,j)=>[h,rows[i][j]||'']));if(!x.customer?.trim()||!x.description?.trim()||!Number.isFinite(Number(x.amount))||Number(x.amount)<0)throw new Error('Invalid customer, description or amount on CSV row '+(i+2));x.id=id();if(x.status==='sent'||x.status==='discussion'){if(!isDate(x.createdAt))x.createdAt=today();if(!isDate(x.nextFollowupAt))x.nextFollowupAt=offsetDate(x.createdAt,state.business.first);}incoming.push(tidyQuote(x));}if(!confirm(`Import ${incoming.length} quote(s) into this browser? Existing quotes will be kept.`))return;state.quotes.push(...incoming);if(state.demo)state.demo=false;tab='quotes';persist();toast(`Imported ${incoming.length} quote(s).`);}
function filePicker(kind){const x=document.createElement('input');x.type='file';x.accept=kind==='json'?'.json,application/json':'.csv,text/csv';x.addEventListener('change',async()=>{const f=x.files?.[0];if(!f)return;if(f.size>3_000_000){toast('File is too large (maximum 3 MB).');return;}try{const text=await f.text();if(kind==='json'){const candidate=validate(JSON.parse(text));if(!confirm('Restore this backup? It REPLACES all existing local data.'))return;state=candidate;tab='dashboard';persist();toast('Backup restored.');}else importCSV(text);}catch(e){alert('Import failed: '+e.message);}});x.click();}
function deleteQuote(q){if(!confirm(`Permanently delete the quote for ${q.customer}? This cannot be undone without a backup.`))return;state.quotes=state.quotes.filter(x=>x.id!==q.id);closeModal();persist();toast('Quote deleted.');}
function reset(){if(!confirm('Delete ALL quotes and settings stored in this browser? Export a backup first if needed.'))return;if(!confirm('Final confirmation: permanently delete this local workspace?'))return;state=defaults();tab='dashboard';closeModal();persist();toast('Local workspace cleared.');}
function action(act,element){const q=state.quotes.find(q=>q.id===element?.dataset?.id);switch(act){case 'tab':tab=element.dataset.tab;query='';filter='all';showMenu=false;render();scrollTo(0,0);break;case 'menu':showMenu=!showMenu;render();break;case 'close-menu':showMenu=false;render();break;case 'new':if(state.quotes.length>=MAX_QUOTES)return toast('Maximum quote limit reached.');quoteForm(null);break;case 'edit':if(q)quoteForm(q);break;case 'save-quote':saveQuote();break;case 'draft':if(q)compose(q);break;case 'copy-draft':copyDraft();break;case 'ai-prompt':aiPrompt();break;case 'email-draft':if(q&&emailSafe(q.email)){const subject=modalRoot.querySelector('#draft-subject').value.replace(/[\r\n]/g,' ');const body=modalRoot.querySelector('#draft-message').value;window.location.href=`mailto:${encodeURIComponent(q.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;toast('Email client opened if your device supports it. Record as sent only after sending.');}break;case 'record-sent':if(q)recordSent(q);break;case 'snooze':if(q){q.nextFollowupAt=offsetDate(today(),3);log(q,'Reminder snoozed for 3 days');persist();toast('Snoozed for 3 days.');}break;case 'replied':if(q){if(!confirm('Record a customer reply and schedule another reminder in 7 days?'))return;q.status='discussion';q.lastContactAt=today();q.nextFollowupAt=offsetDate(today(),7);log(q,'Customer reply recorded');persist();toast('Customer reply recorded.');}break;case 'delete':if(q)deleteQuote(q);break;case 'close':closeModal();break;case 'dismiss':closeModal();break;case 'demo':demo();break;case 'reset-demo':if(confirm('Remove demo quotes and start fresh?')){state=defaults();persist();toast('Ready for your real quotes.');}break;case 'clear':reset();break;case 'export-json':download('quote-rescue-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');toast('Backup downloaded. Store it securely.');break;case 'export-csv':exportCsv();break;case 'template-csv':download('quote-rescue-import-template.csv',csvHeaders.join(',')+'\r\n"","Example Customer","Example Co","name@example.com","","New kitchen",4500,"sent","'+today()+'","'+today()+'","'+today()+'","'+offsetDate(today(),3)+'",0,"Sample only"','text/csv');break;case 'import-json':filePicker('json');break;case 'import-csv':filePicker('csv');break;}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;if(a.dataset.act==='dismiss'&&e.target!==a)return;e.preventDefault();action(a.dataset.act,a);});
document.addEventListener('input',e=>{if(e.target.id==='quote-search'){const pos=e.target.selectionStart;query=e.target.value;const w=document.querySelector('.tablewrap,.empty');const parent=w?.parentElement;if(w&&parent){const temp=document.createElement('div');temp.innerHTML=quotesPage();const fresh=temp.querySelector('.tablewrap,.empty');if(fresh)parent.replaceChild(fresh,w);}const search=document.getElementById('quote-search');if(search){search.focus();search.setSelectionRange(pos,pos);}}});
document.addEventListener('change',e=>{if(e.target.id==='draft-style'||e.target.id==='draft-price'){const q=state.quotes.find(x=>x.id===modalRoot.querySelector('[data-act="record-sent"]')?.dataset.id);if(q)refreshDraft(q);}if(e.target.id==='quote-filter'){filter=e.target.value;render();}if(e.target.id==='quote-sort'){sort=e.target.value;render();}if(e.target.id==='q-created'){const next=document.getElementById('q-next');if(next&&(next.dataset.auto==='1'||!next.value))next.value=offsetDate(e.target.value,state.business.first);}if(e.target.id==='q-next')e.target.dataset.auto='0';});
document.addEventListener('submit',e=>{if(e.target.id!=='settings-form')return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!d.name.trim())return toast('Enter a business name.');if(d.email&&!emailSafe(d.email))return toast('Enter a valid email address.');for(const x of ['first','second','later'])if(!Number.isInteger(Number(d[x]))||Number(d[x])<1||Number(d[x])>90)return toast('Reminder delays must be 1–90 days.');state.business={name:safeText(d.name,100),email:d.email||'',first:Number(d.first),second:Number(d.second),later:Number(d.later)};persist();toast('Settings saved.');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal();});
render();if(location.protocol==='https:'&&'serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
